services:
  - type: web
    name: wotw-discord-bot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: WOTW_CHANNEL_ID
        sync: false
      - key: WOTW_ADMIN_CHANNEL_ID
        sync: false
      - key: WOTW_ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GUESS_COOLDOWN_SECONDS
        value: "3"
